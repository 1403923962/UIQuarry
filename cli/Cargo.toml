[package]
name = "quarry"
version = "0.1.0"
edition = "2021"
description = "Local-first package tooling for the UIQuarry browser component library"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
