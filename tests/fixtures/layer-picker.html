<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Canvas layer picker regression</title>
<style>
  html, body { margin: 0; height: 100%; }
  #bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
  #front { width: 240px; height: 120px; background: white; }
  #button { display: block; width: 120px; height: 60px; background: red; }
</style>
<canvas id="bg-canvas" width="64" height="32"></canvas>
<section id="front"><button id="button">Foreground control</button></section>
<output id="result"></output>
<script>
  // Only the extension message bridge is simulated. Layout, hit testing and PNG encoding run in Chromium.
  let onMessage;
  const messages = [];
  Object.defineProperty(chrome, "runtime", { value: {
    onMessage: { addListener(callback) { onMessage = callback; } },
    sendMessage(message, respond) {
      messages.push(message);
      respond({ok: true});
    }
  } });
</script>
<script src="/content.js"></script>
<script>
  const start = (selector = "") => new Promise(resolve =>
    onMessage({type: "START_PICKER", name: "fixture", targetSelector: selector, includeScreenshot: false}, {}, resolve)
  );
  const keyboard = key => document.dispatchEvent(new KeyboardEvent("keydown", {key, bubbles: true, cancelable: true}));
  function point(type, x = 24, y = 24) {
    return document.elementFromPoint(x, y).dispatchEvent(new MouseEvent(type, {clientX: x, clientY: y, bubbles: true, cancelable: true}));
  }
  function wheel(deltaY, options = {}) {
    const event = new WheelEvent("wheel", {clientX: 24, clientY: 24, deltaY, bubbles: true, cancelable: true, ...options});
    document.elementFromPoint(event.clientX, event.clientY).dispatchEvent(event);
    return event.defaultPrevented;
  }
  function check(value, explanation) { if (!value) throw Error(explanation); }

  async function run() {
    const canvas = document.querySelector("#bg-canvas");
    const context = canvas.getContext("2d");
    context.fillStyle = "#123456";
    context.fillRect(0, 0, 32, 32);
    context.fillStyle = "#00aa11";
    context.fillRect(32, 0, 32, 32);
    const expected = canvas.toDataURL("image/png");
    check(document.elementFromPoint(24, 24).id === "button", "browser must hit the foreground button");
    check(!document.elementsFromPoint(24, 24).includes(canvas), "test canvas must be absent from native pointer targets");

    let pageClicks = 0;
    document.querySelector("#button").addEventListener("click", () => pageClicks++);
    check((await start()).ok, "picker did not start");
    point("mousemove");
    check(!wheel(100), "before pinning, the page owns wheel scrolling");
    check(keyboard("ArrowDown"), "before pinning, arrows should reach the page");
    check(!point("click") && messages.length === 0 && pageClicks === 0, "first click must only pin and suppress the underlying button");
    point("click");
    check(messages.at(-1)?.capture.selector === "#button" && pageClicks === 0, "second click should save the foreground button without activating it");

    await start();
    point("mousemove");
    point("click");
    keyboard("]");
    keyboard("Enter");
    check(messages.at(-1)?.capture.selector === "#front", "next layer did not select the containing section");

    await start();
    point("mousemove");
    point("click");
    keyboard("c");
    point("mousemove", 350, 250);
    point("click", 350, 250);
    const capture = messages.at(-1);
    check(capture.capture.selector === "#bg-canvas", "click replaced the selected canvas with its foreground");
    check(capture.includeScreenshot !== true, "canvas selection requested a viewport screenshot");
    const bitmap = capture.capture.canvasBitmap;
    check(bitmap?.dataUrl === expected, "exported bytes differ from the painted background canvas");
    check(bitmap.width === 64 && bitmap.height === 32, "bitmap must use backing dimensions, independent of CSS width/height");

    await start("#bg-canvas");
    point("mousemove");
    check(!wheel(100), "exact selector should leave scrolling to the page");
    keyboard("Enter");
    check(messages.at(-1)?.capture.selector === "#bg-canvas" && messages.length === 4, "exact selector lost on hover or Enter");
    for (const selector of ["#missing", "section,button", ".["]) {
      check((await start(selector)).ok === false, "invalid, missing or ambiguous selector should not start: " + selector);
    }
    await start();
    point("click");
    point("mousemove", 350, 250);
    check(wheel(100, {clientX: 350, clientY: 250}), "wheel away from the pin should cycle its layers");
    keyboard("ArrowDown");
    point("click", 350, 250);
    check(messages.at(-1).capture.selector === "#bg-canvas", "wheel and Down should advance the same selection");

    await start();
    point("click");
    keyboard("c");
    check(wheel(-100), "upward wheel should select the preceding layer");
    keyboard("Enter");
    check(messages.at(-1).capture.selector === "#front", "wheel-up after choosing canvas should return to the containing section");

    await start();
    point("click");
    for (const modifier of ["ctrlKey", "metaKey", "shiftKey", "altKey"]) {
      check(!wheel(100, {[modifier]: true}), "modified wheel was consumed: " + modifier);
    }
    check(!wheel(0, {deltaX: 100}), "horizontal wheel should reach the page");
    keyboard("Escape");
    check(!wheel(100), "releasing the pin should restore scrolling");
    const count = messages.length;
    point("click", 350, 250);
    check(messages.length === count, "new position should be pinned without saving");
    check(wheel(100, {clientX: 350, clientY: 250}), "even a single pinned layer should keep the page still");
    keyboard("Enter");
    check(messages.at(-1).capture.selector === "#bg-canvas", "repinning must hit the new point");
    await start();
    point("click");
    keyboard("Escape");
    keyboard("Escape");
    check(!document.querySelector("[data-uiquarry-overlay]"), "second Esc should exit after releasing the pin");
    check(!wheel(100), "wheel listener survived cancellation");
    check(point("click") && pageClicks === 1, "cancelled picker must restore normal page clicks");
    check(messages.length === count + 1, "cancelled picker saved a capture");
  }
  run().then(() => { document.querySelector("#result").textContent = "PASS"; })
       .catch(error => { document.querySelector("#result").textContent = "FAIL: " + error.message; });
</script>
</html>
