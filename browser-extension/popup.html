<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UIQuarry</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div class="mark">Q</div><div><h1>UIQuarry · 构石</h1><p>在当前网页选取组件</p></div></header>
    <label for="name">组件名称</label>
    <input id="name" maxlength="100" value="已捕获组件" autocomplete="off">
    <label for="tags">标签 <span>用逗号分隔</span></label>
    <input id="tags" maxlength="300" placeholder="按钮，导航，卡片" autocomplete="off">
    <label for="target-selector">精确定位 <span>可选 · CSS 选择器</span></label>
    <input id="target-selector" maxlength="2048" placeholder="例如 canvas#bg-canvas" autocomplete="off" spellcheck="false">
    <label class="check-row"><input id="include-screenshot" type="checkbox"><span>额外保存整个可视区域的截图</span></label>
    <button id="start" type="button"><span aria-hidden="true">⌖</span> 选择网页元素</button>
    <button id="import" class="secondary" type="button">导入 Capture JSON</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <p id="status" role="status">采集内容只保存在本浏览器，不会自动上传。</p>
    <section aria-labelledby="recent-heading">
      <h2 id="recent-heading">最近捕获</h2>
      <ul id="recent"></ul>
    </section>
    <section id="details" class="details" aria-labelledby="details-heading" hidden>
      <div class="details-header"><h2 id="details-heading">组件详情</h2><button id="close-details" class="close-details" type="button" aria-label="关闭详情">×</button></div>
      <dl id="details-list"></dl>
      <figure id="canvas-frame" hidden>
        <figcaption>画布原始像素 · PNG</figcaption>
        <img id="canvas-image" alt="选中的画布当前帧">
        <button type="button" id="export-canvas" class="capture-action">导出画布 PNG</button>
      </figure>
      <img id="details-shot" alt="采集时的可视区域截图" hidden>
      <pre id="details-preview"></pre>
    </section>
    <p class="hint">先滚动页面找到目标，左键定点。再用滚轮或 ↑↓ 切层，按 C 直达画布。点击或按 Enter 保存，Esc 重选。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
